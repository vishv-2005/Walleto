<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walleto — WhatsApp Dashboard</title>
  <meta name="description" content="Walleto business dashboard for WhatsApp message categorization" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <h1 class="logo">📱 Walleto</h1>
      <span class="tagline">WhatsApp Business Dashboard</span>
    </div>
    <div class="header-right">
      <span class="live-dot"></span>
      <span class="live-text">Live</span>
      <button id="clearBtn" class="btn-clear" title="Clear all messages">🗑️ Clear</button>
    </div>
  </header>

  <!-- Stats Cards -->
  <section class="stats-grid" id="statsGrid">
    <div class="stat-card stat-total">
      <div class="stat-icon">📨</div>
      <div class="stat-info">
        <span class="stat-value" id="statTotal">0</span>
        <span class="stat-label">Total Messages</span>
      </div>
    </div>
    <div class="stat-card stat-order">
      <div class="stat-icon">🛒</div>
      <div class="stat-info">
        <span class="stat-value" id="statOrder">0</span>
        <span class="stat-label">Orders</span>
      </div>
    </div>
    <div class="stat-card stat-inquiry">
      <div class="stat-icon">❓</div>
      <div class="stat-info">
        <span class="stat-value" id="statInquiry">0</span>
        <span class="stat-label">Inquiries</span>
      </div>
    </div>
    <div class="stat-card stat-complaint">
      <div class="stat-icon">⚠️</div>
      <div class="stat-info">
        <span class="stat-value" id="statComplaint">0</span>
        <span class="stat-label">Complaints</span>
      </div>
    </div>
    <div class="stat-card stat-feedback">
      <div class="stat-icon">💬</div>
      <div class="stat-info">
        <span class="stat-value" id="statFeedback">0</span>
        <span class="stat-label">Feedback</span>
      </div>
    </div>
    <div class="stat-card stat-invalid">
      <div class="stat-icon">🚫</div>
      <div class="stat-info">
        <span class="stat-value" id="statInvalid">0</span>
        <span class="stat-label">Invalid</span>
      </div>
    </div>
  </section>

  <!-- Filter & Test -->
  <section class="controls">
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="order">🛒 Orders</button>
      <button class="filter-btn" data-filter="inquiry">❓ Inquiries</button>
      <button class="filter-btn" data-filter="complaint">⚠️ Complaints</button>
      <button class="filter-btn" data-filter="feedback">💬 Feedback</button>
      <button class="filter-btn" data-filter="invalid">🚫 Invalid</button>
    </div>
    <div class="test-input">
      <input type="text" id="testMessage" placeholder="Type a test message..." />
      <button id="testBtn" class="btn-send">Send</button>
    </div>
  </section>

  <!-- Messages Feed -->
  <section class="messages-feed" id="messagesFeed">
    <p class="empty-state" id="emptyState">No messages yet. Send a WhatsApp message or use the test input above!</p>
  </section>

  <script src="app.js"></script>
</body>
</html>
